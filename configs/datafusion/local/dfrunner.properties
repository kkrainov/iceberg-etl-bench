# dfrunner configuration, Phase L (single node, engine `df`). Mounted read-only at
# /etc/dfrunner/dfrunner.properties by infra/local/compose.yaml.
# Rule (methodology section 2): DataFusion 55 defaults everywhere, except the memory
# pool, spilling and parallelism, which are set to match the hardware and Trino.
# Every value below says why. Keys: dfrunner.* (server), catalog.* (Iceberg REST),
# s3.* (iceberg-rust FileIO), datafusion.* / iceberg.* (session options, verbatim).

dfrunner.listen=0.0.0.0:9000

# ---- Memory (methodology section 2, memory parity) ----
# Pool limit = Trino query.max-memory-per-node (configs/trino/local/config.properties),
# in the same 8 GiB container. The pool is TrackConsumersPool<GreedyMemoryPool>, the one
# DataFusion builds for RuntimeEnvBuilder::with_memory_limit (its default when a limit
# is set); dfrunner wraps it only to record the high-water mark per query.
# B2 memory levels scale this value with the container limit.
dfrunner.memory_pool.limit=4GiB
# Non-default: no spilling. DataFusion's default disk manager spills to the OS temp dir;
# disabled, an operator that would spill fails with ResourcesExhausted instead. Matches
# Trino's default (spill disabled), the methodology (in-memory execution only) and
# Rino v1 (diskless nodes).
dfrunner.disk_manager=disabled

# ---- Parallelism ----
# = the container CPU limit (M0_ENGINE_CPUS, 12 in Phase L). DataFusion's default is the
# number of CPUs the process sees, which is the same here; set explicitly so a smaller
# CPU limit (A3, Phase C) can't silently fall back to the host's CPU count.
datafusion.execution.target_partitions=12

# ---- Iceberg REST catalog (Lakekeeper) and object store (SeaweedFS) ----
# Same catalog and warehouse as Trino (configs/trino/local/catalog/iceberg.properties).
# Storage access is client-managed: static credentials from AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY in the container environment, nothing vended.
catalog.name=iceberg
catalog.uri=http://catalog:8181/catalog
catalog.warehouse=m0
catalog.startup_wait_s=60
s3.endpoint=http://objstore:8333
s3.region=us-east-1
s3.path-style-access=true

# ---- Build (not runtime settings; recorded here so all DataFusion choices are in one place) ----
# dfrunner/Cargo.toml [profile.release]: opt-level 3, thin LTO, 16 codegen units, no
# debuginfo. Upstream datafusion-distributed sets no release profile (plain release);
# thin LTO adds cross-crate inlining at modest cost. Measured (Ryzen 5 7600X, 12 threads,
# Docker BuildKit, engines stopped): first build 406 s, host memory peak ~4.7 GiB used;
# a fat-LTO / codegen-units=1 build was not attempted (build time and the 11.7 GiB host).
# Allocator: mimalloc, as in upstream's remote-worker and datafusion-cli.
