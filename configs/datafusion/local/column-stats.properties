# Extra dfrunner keys for the `-cs` engine variants (df-cs, df-jo-cs, df-sail-cs, step 4c),
# read after dfrunner.properties (DFRUNNER_CONFIG_EXTRA in infra/local/compose.yaml).
# Everything else is dfrunner.properties unchanged.

# Non-default: datafusion-distributed's Iceberg provider reports per-column statistics
# (min/max and null counts from the manifests, NDV from Puffin files when present) only
# with this on; off (the default), scans report row counts and bytes only. Separates
# missing statistics from missing join ordering.
iceberg.column_stats_enabled=true
