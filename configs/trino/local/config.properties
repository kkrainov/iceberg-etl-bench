# Phase L: single-node Trino (the coordinator also executes tasks).
# Every non-default value below has its reason and the Trino 484 doc it follows.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Methodology baseline: in-memory pipelined execution, no fault-tolerant execution.
retry-policy=NONE

# ---- Memory (https://trino.io/docs/484/admin/properties-resource-management.html) ----
# Container 8 GiB -> JVM heap 80% (jvm.config MaxRAMPercentage) = 6560 MiB as
# reported by /v1/status heapAvailable. Trino requires
#   query.max-memory-per-node + memory.heap-headroom-per-node <= max heap
# and refuses to start otherwise (same doc, "query.max-memory-per-node").
#
# Headroom for allocations Trino does not track. Default is 30% of the heap
# (1.92 GiB); kept at that level, rounded up to 2 GiB.
memory.heap-headroom-per-node=2GB
# Default is 30% of the heap (1.92 GiB), sized for many concurrent queries per
# node. The benchmark runs one query at a time (methodology section 5), so one
# query may use what the headroom leaves: 6.41 - 2 = 4.41 GiB, rounded down to
# 4 GiB (= 50% of the container). DataFusion's memory pool is set to the same
# 4 GiB in the same 8 GiB container (methodology section 2, memory parity).
# B2 memory levels scale this value with the container limit.
query.max-memory-per-node=4GB
# Default 20GB is a cluster-wide limit; on one node it can never bind before the
# per-node limit. Set equal to the per-node limit so the only memory limit a
# query meets is the per-node one (EXCEEDED_LOCAL_MEMORY_LIMIT).
query.max-memory=4GB
