# Phase L: single-node Trino (the coordinator also executes tasks).
# Tuning per the Trino docs is finalised in step 3; every non-default value is
# listed in docs with its reason.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Methodology baseline: in-memory pipelined execution, no fault-tolerant execution.
retry-policy=NONE
