connector.name=tpch
# Data generation source (m0 data gen). Spec-conformant shape so the Iceberg tables
# match the TPC-H schema and standard query text: l_/o_/… column prefixes and
# DECIMAL(12,2) money columns (the connector defaults are unprefixed names and DOUBLE).
tpch.column-naming=STANDARD
tpch.double-type-mapping=DECIMAL
