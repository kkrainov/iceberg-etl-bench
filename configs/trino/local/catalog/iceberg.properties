connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181/catalog
iceberg.rest-catalog.warehouse=m0
# Client-managed storage access: both engines use the same static S3 credentials
# (mirrors IAM-role access on AWS); Lakekeeper vends nothing.
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.unique-table-location=true
fs.s3.enabled=true
s3.endpoint=http://objstore:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
