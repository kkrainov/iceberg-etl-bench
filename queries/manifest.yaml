# Query catalogue. Canonical text is Trino SQL in queries/<suite>/<id>.sql.
# Table names use namespace placeholders, substituted from the plan's scale factor:
#   ${tpch} -> iceberg.tpch_sf<N>   ${tpcds} -> iceberg.tpcds_sf<N>   ${etl} -> iceberg.etl_sf<N>
# Fields:
#   namespaces     placeholders the SQL uses (checked against the file)
#   class          tpc | join | window | aggregation | deliberate
#   ordered        the query ends in an ORDER BY (compare in order; methodology 8)
#   sort_keys      ordered queries: result columns (1-based) that are ORDER BY keys, in ORDER BY
#                  order. Keys that are expressions, not result columns, are left out. The
#                  differ checks the order on these columns only.
#   tie_ambiguous  LIMIT with possible ties on the sort keys at the cut (compare on sort keys
#                  only). None is set: on Trino, row LIMIT and row LIMIT+1 of every ordered LIMIT
#                  query differ on their sort keys at SF1 and SF10, or are identical rows.
#   rewrite        null, or the reason this query differs from its source text
#   source         where the text comes from: a spec section, or repo@sha:path (NOTICE)
#   datafusion_override  (optional) reason for queries/overrides/datafusion/<suite>/<id>.sql,
#                  used by df/dfd. Mechanical rewrites only (function name, syntax), never
#                  a change of semantics; a query DataFusion can't express is err_unsupported.
# Ids: q01..q22 (TPC-H), q01..q99 (TPC-DS); the two-part TPC-DS queries 14, 23, 24 and 39 are
# q14a/q14b, q23a/q23b, q24a/q24b, q39a/q39b, as in trinodb/trino's benchmark queries.
