# A1 + A2 at SF1 (Phase L): every TPC-H and TPC-DS query on trino and df, two rounds in
# ABBA order (trino, df, df, trino). Small and fast: a full pass of the catalogue for
# correctness and a first look at the ratios, not the main measurement (that is SF10).
# cold: per_block, so iteration 0 is a first run, not a cold one (one restart and cache
# drop per block; per_query would add ~2 hours of restarts). Timeout: the slowest query
# takes ~20 s at SF1, so 120 s stops a stuck query without cutting off a slow one.
name: phase-l-a1a2-sf1
phase: L
sf: 1
seed: 20261025
engines: [trino, df]
mem_levels: [100]
iterations: 3          # hot runs after the first run of each query
cold: per_block
timeout_s: 120
queries:
  - suite: tpch            # A1: all 22 TPC-H queries
    ids: [q01, q02, q03, q04, q05, q06, q07, q08, q09, q10, q11, q12, q13, q14, q15, q16, q17,
          q18, q19, q20, q21, q22]
  - suite: tpcds           # A2: all 99 TPC-DS queries (14, 23, 24, 39 in two parts: a, b)
    ids: [q01, q02, q03, q04, q05, q06, q07, q08, q09, q10, q11, q12, q13, q14a, q14b, q15,
          q16, q17, q18, q19, q20, q21, q22, q23a, q23b, q24a, q24b, q25, q26, q27, q28, q29,
          q30, q31, q32, q33, q34, q35, q36, q37, q38, q39a, q39b, q40, q41, q42, q43, q44,
          q45, q46, q47, q48, q49, q50, q51, q52, q53, q54, q55, q56, q57, q58, q59, q60, q61,
          q62, q63, q64, q65, q66, q67, q68, q69, q70, q71, q72, q73, q74, q75, q76, q77, q78,
          q79, q80, q81, q82, q83, q84, q85, q86, q87, q88, q89, q90, q91, q92, q93, q94, q95,
          q96, q97, q98, q99]
