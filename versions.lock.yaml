# Single source of truth for every pinned version.
# `m0 env` passes the images below to Docker Compose; `env.json` of every run
# records this file's hash plus the resolved image digests.

images:
  trino: trinodb/trino:484                         # 2026-10-16; methodology baseline
  catalog: quay.io/lakekeeper/catalog:v0.14.0       # Iceberg REST catalog (Phase L only)
  catalog_db: postgres:17.6                         # Lakekeeper metadata store
  objstore: chrislusf/seaweedfs:4.48                # S3-compatible storage (Phase L only)
  # Short-lived privileged helper for cold runs: `sync; echo 3 > /proc/sys/vm/drop_caches`.
  # Pinned by digest because busybox tags are rebuilt.
  cache_drop: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

engines:
  datafusion: "55"                                  # resolved by dfrunner/Cargo.lock (step 3)
  datafusion_distributed: "4.0.0"
  iceberg_rust: 5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3   # rev used by datafusion-distributed-iceberg

tools:
  python: ">=3.12"
  uv: "0.12.24"
