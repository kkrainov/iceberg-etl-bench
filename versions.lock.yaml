# Single source of truth for every pinned version.
# `m0 env` passes the images below to Docker Compose; `run.json` of every run
# records this file's hash plus the resolved image digests.

images:
  trino: trinodb/trino:484                         # 2026-10-16; methodology baseline
  catalog: quay.io/lakekeeper/catalog:v0.14.0       # Iceberg REST catalog (Phase L only)
  catalog_db: postgres:17.6                         # Lakekeeper metadata store
  objstore: chrislusf/seaweedfs:4.48                # S3-compatible storage (Phase L only)
  # Short-lived privileged helper for cold runs: `sync; echo 3 > /proc/sys/vm/drop_caches`.
  # Pinned by digest because busybox tags are rebuilt.
  # dfrunner (engine `df`, later `dfd`) build: Rust builder and slim runtime, pinned by
  # multi-platform index digest (amd64 now, arm64 in Phase C). Rust 1.95 is the minimum
  # datafusion-distributed-iceberg declares (rust-version = "1.95.0").
  dfrunner_builder: rust:1.95.0-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
  dfrunner_runtime: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  cache_drop: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

# Resolved by dfrunner/Cargo.lock (committed); dfrunner's /status reports the same values.
engines:
  datafusion: "55.0.0"
  # Crate version 4.0.0 at main@ee3eacd (2026-10-24). The v4.0.0 tag (4cfa166, 2026-08-20)
  # has neither the Iceberg crate nor benchmarks/remote-worker; both, and the revisions
  # below, exist only on main after the tag.
  datafusion_distributed: "4.0.0@ee3eacd93af66e4ef2e2e72a253842c723f92ca5"
  datafusion_distributed_iceberg: "0.1.0@ee3eacd93af66e4ef2e2e72a253842c723f92ca5"
  iceberg_rust: "0.10.1@5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3"        # incl. iceberg-catalog-rest
  datafusion_iceberg: "0.12.0@20327db58c7a44330366da00a34a26e866d0da4d"  # apache/datafusion-iceberg
  arrow: "59.3.0"
  # Step 4c engine variants (methodology section 2). dfrunner/patches/prepare.sh builds them.
  # jo (df-jo, df-jo-cs): apache/datafusion#24456 backported onto 55.0.0 as a patch to the
  # crates.io 55.0.0 sources of datafusion-common, -physical-optimizer, -physical-plan.
  datafusion_pr24456:
    head: "472e83e1289eec0b482a5b3d4d0dc1f5140fe878"        # Dandandan/datafusion perf/join-order-enumeration
    merge_base: "242b96c231636b5738125678a83197896a5cc64b"  # apache/datafusion main, 2026-10-01
    patch: dfrunner/patches/datafusion-55.0.0-pr24456.patch
    patch_sha256: "535984dc9768f690b38a5eff8c5da8c1f859522480f851315f1df80f7aab305c"
    lockfile_sha256: "6eaa72078de1acef36c7834f6ff230f94c42b6e5c2a385e713dd6a1a3aac59ad"                              # dfrunner/patches/jo.Cargo.lock
  # sail (df-sail, df-sail-cs): Sail's JoinReorder rule, copied into dfrunner/src/sail_join_reorder/.
  sail: "86dea385943c785b38d85479755589d193f989d3"            # lakehq/sail main, 2026-10-26 (module last changed at 36431029)
  rust: "1.95.0"

tools:
  python: ">=3.12"
  uv: "0.12.24"
