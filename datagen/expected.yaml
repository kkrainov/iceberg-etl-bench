# Free disk needed before generating, in GiB per unit of scale factor: the measured
# on-storage size (SF10 / 10, rounded up). `m0 data gen` requires twice this times the
# SF plus a fixed reserve, to cover object-store overhead and dropped-table garbage
# until SeaweedFS vacuums it.
disk_gib_per_sf:
  tpch: 0.25    # measured SF10: 2.1 GiB
  tpcds: 0.3    # measured SF10: 2.7 GiB
  etl: 0.25     # measured SF10: 2.0 GiB
