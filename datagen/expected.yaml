# Expected row counts per suite, scale factor and table. `m0 data gen` and
# `m0 data status` validate every table against these numbers.
# - tpch: TPC-H spec 2.x, section 4.2.5 (lineitem is approximate in the spec; the
#   exact dbgen count is used, which the Trino connector reproduces).
# - tpcds: TPC-DS spec 3.x, table 3-2 (dbgen_version is not generated: no query uses it).
# - etl: produced by datagen/etl/*.sql with datagen/etl/params.yaml; recorded from the
#   generator. Regenerating must reproduce them exactly.
# Table order is generation order.

