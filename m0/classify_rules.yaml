# Outcome rules for engine errors (methodology section 7). Signals that don't come
# from an error message are applied first, in code (m0/classify.py):
#   killed        oom_kill counter increment, Docker OOMKilled, a container exit code in
#                 killed_exit_codes, or the engine exiting by itself on memory exhaustion
#                 (memory_exit_codes; Trino's JVM uses -XX:+ExitOnOutOfMemoryError -> 3)
#   timeout       harness timeout reached; the query was cancelled
#   unresponsive  health check fails after the query ended or was cancelled
# Then the first rule below whose fields all match wins. Fields are regexes:
# `error_name` and `error_type` must match fully; `message` is searched.
# An error no rule matches is err_other with unrecognised=true.
# `engine` is one engine or a list. Every rule needs a test with a real error string
# (tests/fixtures/trino_errors.yaml, tests/fixtures/df_errors.yaml).
# DataFusion (dfrunner): error_name = root DataFusionError variant (ResourcesExhausted,
# NotImplemented, SQL, Plan, Execution, ArrowError, ...), error_type = first context label
# (e.g. IcebergError(FeatureUnsupported)), message = the full DataFusion message.
killed_exit_codes: [137]
memory_exit_codes:
  trino: [3]

rules:
  - id: trino.memory_limit
    engine: trino
    outcome: err_mem
    error_name: EXCEEDED_LOCAL_MEMORY_LIMIT|EXCEEDED_GLOBAL_MEMORY_LIMIT|CLUSTER_OUT_OF_MEMORY
  - id: trino.unsupported
    engine: trino
    outcome: err_unsupported
    error_name: NOT_SUPPORTED|FUNCTION_NOT_FOUND|SYNTAX_ERROR|FUNCTION_IMPLEMENTATION_MISSING
  - id: trino.time_limit
    engine: trino
    outcome: err_other
    error_name: EXCEEDED_TIME_LIMIT|EXCEEDED_CPU_LIMIT
  - id: trino.missing_object
    engine: trino
    outcome: err_other
    error_name: (TABLE|SCHEMA|CATALOG|COLUMN)_NOT_FOUND

  # ---- DataFusion (df and its step 4c variants; dfd from step 5) ----
  - id: df.memory_limit
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_mem
    error_name: ResourcesExhausted
  - id: df.not_implemented
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_unsupported
    error_name: NotImplemented
  - id: df.syntax
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_unsupported
    error_name: SQL
  - id: df.iceberg_unsupported
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_unsupported
    error_type: IcebergError\(FeatureUnsupported\)
  # Plan errors: a missing table is not a missing feature; an unknown function or an
  # unsupported construct is.
  - id: df.missing_object
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_other
    error_name: Plan
    message: "table '[^']+' not found|[Ss]chema .* not found|No field named"
  - id: df.unsupported_plan
    engine: [df, df-cs, df-jo, df-jo-cs, df-sail, df-sail-cs, dfd, dfd-jo]
    outcome: err_unsupported
    error_name: Plan
    message: "Invalid function|[Nn]ot supported|[Uu]nsupported"
