# Phase L local stack. Started and stopped through `m0 env`, which supplies the
# pinned image names from versions.lock.yaml as environment variables.
# Credentials below are local-only placeholders; nothing here is reachable
# from outside this machine (ports bind to 127.0.0.1).

name: m0

x-s3-creds: &s3-creds
  AWS_ACCESS_KEY_ID: m0local
  AWS_SECRET_ACCESS_KEY: m0localsecret

services:
  objstore:
    image: ${M0_IMAGE_OBJSTORE}
    command: >
      server -dir=/data -ip=objstore -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=0 -master.volumeSizeLimitMB=1024
      -s3.concurrentUploadLimitMB=256 -volume.concurrentUploadLimitMB=256
      -s3.readerCacheSizeMB=256 -volume.concurrentDownloadLimitMB=256
    # Bounded upload buffers plus a Go soft memory limit: without them, multi-GB
    # CTAS writes from Trino (data generation) got SeaweedFS OOM-killed at 768m.
    # Bounded read buffers (step 3b): DataFusion's scans (many concurrent ranged GETs)
    # drove unbounded reader buffers to the 1 GiB limit and SeaweedFS was OOM-killed;
    # the same caps apply to both engines.
    environment:
      GOMEMLIMIT: 640MiB
    volumes:
      - objstore-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 1g

  catalog-db:
    image: ${M0_IMAGE_CATALOG_DB}
    environment:
      POSTGRES_PASSWORD: m0local
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  catalog-migrate:
    image: ${M0_IMAGE_CATALOG}
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: m0-local-only-not-a-secret
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:m0local@catalog-db:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:m0local@catalog-db:5432/postgres
      RUST_LOG: info
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"

  catalog:
    image: ${M0_IMAGE_CATALOG}
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    mem_limit: 256m

  trino:
    profiles: ["trino"]
    image: ${M0_IMAGE_TRINO}
    environment: *s3-creds
    volumes:
      - ../../configs/trino/local/config.properties:/etc/trino/config.properties:ro
      - ../../configs/trino/local/jvm.config:/etc/trino/jvm.config:ro
      - ../../configs/trino/local/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 3s
      timeout: 5s
      retries: 60
    depends_on:
      catalog:
        condition: service_healthy
      objstore:
        condition: service_healthy
    mem_limit: ${M0_ENGINE_MEM:-8g}
    memswap_limit: ${M0_ENGINE_MEM:-8g}
    cpus: ${M0_ENGINE_CPUS:-12}

  # Plain DataFusion (engine `df`): dfrunner in `single` mode, built locally from
  # ../../dfrunner (pinned builder/runtime images from versions.lock.yaml).
  df:
    profiles: ["df"]
    image: m0-dfrunner:local
    build:
      context: ../../dfrunner
      args:
        BUILDER_IMAGE: ${M0_IMAGE_DFRUNNER_BUILDER}
        RUNTIME_IMAGE: ${M0_IMAGE_DFRUNNER_RUNTIME}
    command: ["single"]
    # tini as PID 1: dfrunner has no SIGTERM handler, so without it every stop (engine
    # switch, cold restart) waited out Docker's 10 s grace period before SIGKILL.
    init: true
    environment:
      <<: *s3-creds
      RUST_LOG: info
    volumes:
      - ../../configs/datafusion/local/dfrunner.properties:/etc/dfrunner/dfrunner.properties:ro
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/dfrunner", "healthcheck"]
      interval: 1s
      timeout: 5s
      retries: 120
    depends_on:
      catalog:
        condition: service_healthy
      objstore:
        condition: service_healthy
    mem_limit: ${M0_ENGINE_MEM:-8g}
    memswap_limit: ${M0_ENGINE_MEM:-8g}
    cpus: ${M0_ENGINE_CPUS:-12}

volumes:
  objstore-data:
  catalog-db-data:
