# Phase L local stack. Started and stopped through `m0 env`, which supplies the
# pinned image names from versions.lock.yaml as environment variables.
# Credentials below are local-only placeholders; nothing here is reachable
# from outside this machine (ports bind to 127.0.0.1).

name: m0

x-s3-creds: &s3-creds
  AWS_ACCESS_KEY_ID: m0local
  AWS_SECRET_ACCESS_KEY: m0localsecret

services:
  objstore:
    image: ${M0_IMAGE_OBJSTORE}
    command: >
      server -dir=/data -ip=objstore -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=0 -master.volumeSizeLimitMB=1024
    volumes:
      - objstore-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 768m

  catalog-db:
    image: ${M0_IMAGE_CATALOG_DB}
    environment:
      POSTGRES_PASSWORD: m0local
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 256m

  catalog-migrate:
    image: ${M0_IMAGE_CATALOG}
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: m0-local-only-not-a-secret
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:m0local@catalog-db:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:m0local@catalog-db:5432/postgres
      RUST_LOG: info
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"

  catalog:
    image: ${M0_IMAGE_CATALOG}
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    mem_limit: 256m

  trino:
    profiles: ["trino"]
    image: ${M0_IMAGE_TRINO}
    environment: *s3-creds
    volumes:
      - ../../configs/trino/local/config.properties:/etc/trino/config.properties:ro
      - ../../configs/trino/local/jvm.config:/etc/trino/jvm.config:ro
      - ../../configs/trino/local/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 3s
      timeout: 5s
      retries: 60
    depends_on:
      catalog:
        condition: service_healthy
      objstore:
        condition: service_healthy
    mem_limit: ${M0_ENGINE_MEM:-8g}
    memswap_limit: ${M0_ENGINE_MEM:-8g}
    cpus: ${M0_ENGINE_CPUS:-12}

volumes:
  objstore-data:
  catalog-db-data:
